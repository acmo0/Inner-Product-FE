[package]
name = "benches"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true
codegen-units = 1
lto = "fat"
panic = "abort"


[dependencies]
criterion = {version = "0.8.1", features = ["html_reports"]}
rand = { version = "0.10.0-rc.8" }
fe = { path = "../fe", default-features = false }

[[bench]]
name = "DDH-EC-FE"
path = "src/bench_ristretto.rs"
harness = false

[[bench]]
name = "Nilsimsa-comparator"
path = "src/bench_nilsimsa_comparator.rs"
harness = false